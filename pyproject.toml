[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "orchid-memory-gateway"
version = "0.1.0"
description = "Local OpenAI-compatible memory gateway with versioned compaction primitives"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "pydantic>=2.10",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
# SpecPrefill (memory_gateway.specprefill): the student runtime and Strata's frontend.
# torch 2.7.1 (CUDA 12.6 wheels) still carries Pascal (sm_60) kernels; transformers
# 5.19.0 is the version the student was measured with.
specprefill = [
  "torch==2.7.1",
  "transformers==5.19.0",
  "tokenizers>=0.21",
  "safetensors>=0.4",
  "jinja2>=3.1",
  "regex>=2024.0",
  "numpy>=1.26",
  "pillow>=10.0",
]
test = ["pytest>=8.3", "hypothesis>=6.100"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "hypothesis>=6.100",
  "ruff>=0.9",
]
experiments = [
  "huggingface_hub>=0.24",
  "numpy>=1.26",
  "onnxruntime>=1.18",
  "tokenizers>=0.19",
]

[project.scripts]
orchid-specprefill = "memory_gateway.specprefill.setup:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.coverage.run]
source = ["memory_gateway"]
omit = ["memory_gateway/__init__.py"]

[tool.coverage.report]
fail_under = 90
include = [
  "memory_gateway/transport/prompt_cache.py",
  "memory_gateway/publication_economics.py",
  "memory_gateway/compaction_forecast.py",
  "memory_gateway/admission/offline_gate.py",
]

[tool.setuptools.packages.find]
include = ["memory_gateway*"]
